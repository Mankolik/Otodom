name: Export Otodom listing

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Exact Otodom listing URL"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: otodom-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape exact listing
        id: scrape
        shell: bash
        env:
          OTODOM_URL: ${{ inputs.url }}
        run: |
          python scrape.py "$OTODOM_URL"
          CODE="$(cat share_code.txt)"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Save listing in repository
        shell: bash
        run: |
          git config user.name "otodom-share-code[bot]"
          git config user.email "otodom-share-code[bot]@users.noreply.github.com"
          git add exports/
          if git diff --cached --quiet; then
            echo "No listing data changed."
          else
            git commit -m "Export ${{ steps.scrape.outputs.code }}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Show share code
        shell: bash
        run: |
          CODE='${{ steps.scrape.outputs.code }}'
          {
            echo "## Otodom export complete"
            echo
            echo "Send ChatGPT this code:"
            echo
            echo '```'
            echo "$CODE"
            echo '```'
            echo
            echo "The listing data has been saved under \`exports/\`."
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "=================================="
          echo " SHARE CODE: $CODE"
          echo "=================================="
