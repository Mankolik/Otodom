name: Export Otodom listing

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Exact Otodom listing URL"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: otodom-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Scrape exact listing
        id: scrape
        shell: bash
        env:
          OTODOM_URL: ${{ inputs.url }}
        run: |
          python scrape.py "$OTODOM_URL"
          CODE="$(cat share_code.txt)"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Rebuild saved-listings catalog
        run: python build_index.py

      - name: Save listing and catalog in repository
        shell: bash
        run: |
          git config user.name "otodom-share-code[bot]"
          git config user.email "otodom-share-code[bot]@users.noreply.github.com"
          git add exports/
          if git diff --cached --quiet; then
            echo "No listing data changed."
          else
            git commit -m "Export ${{ steps.scrape.outputs.code }}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Show result
        shell: bash
        run: |
          CODE='${{ steps.scrape.outputs.code }}'
          ID="${CODE#OTO-}"
          {
            echo "## Otodom export complete"
            echo
            python - "$ID" <<'PY'
          import json, sys
          from pathlib import Path
          listing_id = sys.argv[1]
          p = Path("exports") / f"{listing_id}.json"
          d = json.loads(p.read_text(encoding="utf-8"))
          main = d.get("main", {})
          loc = d.get("location", {})
          ident = d.get("identity", {})
          price = main.get("price")
          czynsz = main.get("czynsz")
          total = None
          try:
              total = float(price or 0) + float(czynsz or 0)
              if total.is_integer():
                  total = int(total)
          except Exception:
              pass
          print(f"**{ident.get('title') or listing_id}**")
          print()
          print(f"- Street: {loc.get('street') or '—'}")
          print(f"- Area: {main.get('area_m2') or '—'} m²")
          print(f"- Rent: {price if price is not None else '—'} zł")
          print(f"- Czynsz: {czynsz if czynsz is not None else '—'} zł")
          print(f"- Fixed total: {str(total) + ' zł' if total is not None else '—'}")
          print(f"- Otodom ID: {listing_id}")
          PY
            echo
            echo "The repository catalog in \`exports/index.json\` and \`exports/index.md\` has also been refreshed."
            echo
            echo "You do **not** need to remember the ID — you can ask ChatGPT to show or find your saved Otodom listings."
          } >> "$GITHUB_STEP_SUMMARY"
